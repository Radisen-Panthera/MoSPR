[project]
name = "mospr"
version = "0.1.0"
description = "MoSPR: state-structured linear prediction of bulk transcriptomes from H&E slides"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "h5py==3.16.0",
    "matplotlib==3.10.9",
    "pillow==12.3.0",
    "gseapy==1.3.1",
]

[project.optional-dependencies]
features = ["torch>=2.4", "timm>=1.0", "openslide-python>=1.3", "openslide-bin>=4.0", "anndata>=0.10", "opencv-python-headless>=4.8", "scikit-image>=0.22", "natsort>=8.4", "tqdm>=4.66"]
