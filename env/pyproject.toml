[project]
name = "mospr"
version = "0.1.0"
description = "MoSPR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hydra-core>=1.3.5",
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "rdkit>=2026.3.5",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torch-geometric>=2.8.0.post1",
    "torchvision>=0.26.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------
# uv 설정
# ---------------------------------------------------------------
[tool.uv]
# .venv 와 같은 파일시스템(/data)에 캐시를 두어야 hardlink 가 동작한다.
# 기본값(~/.cache/uv)은 /dev/md0, .venv 는 /dev/nvme2n1p1 이라 매번 복사가 발생.
cache-dir = "/data/gglee/.cache/uv"
link-mode = "hardlink"

# PyTorch 는 PyPI 가 아니라 CUDA 12.8 전용 인덱스에서만 받는다.
# RTX PRO 6000 Blackwell = sm_120 → cu128 이상 필수 (cu126 이하는 커널 없음).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "ruff>=0.16.3",
]
