GENERAL:
  seed: 2021
  log_path: ./logs
  ckpt_path: ./ckpts/exps
  wandb: False
  gpu: 0
  
TRAINING:
  batch_size: 8
  num_workers: 8
  optimizer: adam
  learning_rate: 1.0e-3
  num_epochs: 1000
  early_stopping:
    monitor: valid_neglike
    patience: 30
    mode: min
  
MODEL:
  latent_dim: 10
  loss_type: 'NegativeBinomial'
  prop: True
  prop_cls: 29
  warmupsteps: 2000


DATASET:
  dataset: PropDataset
  testdataset: PropDataset
  collate_fn: collate_fn
  data_dir: <DATA_ROOT>
  dir_name: sample_pair4mil
  
  


